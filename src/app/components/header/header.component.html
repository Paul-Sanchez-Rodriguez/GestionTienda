<header class="header">
  <div class="header__inner">
    <a routerLink="/" class="header__brand">
      <span class="header__logo">TN</span>
      <div>
        <strong>{{ store.name }}</strong>
        <small>{{ store.tagline }}</small>
      </div>
    </a>

    <nav class="header__nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        Inicio
      </a>
      <a routerLink="/" fragment="productos">Productos</a>
      <a routerLink="/clientes" routerLinkActive="active">Clientes</a>
      <a routerLink="/" fragment="contacto">Contacto</a>
    </nav>
  </div>
</header>
