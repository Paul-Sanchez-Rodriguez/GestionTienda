<footer class="footer">
  <div class="footer__inner">
    <div class="footer__brand">
      <strong>{{ store.name }}</strong>
      <p>{{ store.description }}</p>
    </div>

    <div class="footer__contact">
      <h4>Contacto</h4>
      <p>{{ store.address }}</p>
      <p>{{ store.phone }}</p>
      <p>{{ store.email }}</p>
      <p>{{ store.hours }}</p>
    </div>
  </div>

  <div class="footer__bottom">
    <p>&copy; {{ year }} {{ store.name }}. Todos los derechos reservados.</p>
  </div>
</footer>
